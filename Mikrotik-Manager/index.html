    <script>
      // Gracefully prevent unhandled promise rejections from Vite WebSocket client disconnects in iframes
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason) {
          var msg = typeof event.reason === 'string' ? event.reason : (event.reason.message || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1) {
            event.preventDefault();
          }
        }
      });
    </script>
